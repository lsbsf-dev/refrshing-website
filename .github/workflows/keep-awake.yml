name: Keep Render App Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render's 15-minute idle timeout
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the application
        run: curl -s https://refrshing-website.onrender.com/api/ping || exit 0
